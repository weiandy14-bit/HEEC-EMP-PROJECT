# Local full-stack for HEEC EMP (development / demo parity with production shape):
# PostgreSQL 16, ClamAV, MinIO (S3-compatible), the API, and the nginx-served SPA.
# Production uses managed equivalents (Neon + Cloudflare R2 + a scanning service);
# this compose mirrors the wiring so the same image and env work in both.
#
#   docker compose up -d --build
#   docker compose run --rm migrate   # apply migrations + seed once
#
# NOTE: the api connects as the PostgreSQL superuser here (RLS policies dormant,
# app-layer scope checks primary), matching current app behaviour. Enabling the
# least-privilege app_rw connection additionally requires per-request
# SET LOCAL app.current_org wiring — see docs/PHASE6_DEPLOY.md.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: empdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d empdb"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"

  clamav:
    image: clamav/clamav:1.3
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --version || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    ports:
      - "9000:9000"
      - "9001:9001"

  # One-shot: apply migrations then seed. Uses the postgres image (has psql).
  migrate:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/empdb
    volumes:
      - ./db:/db:ro
    entrypoint: ["bash", "-lc", "bash /db/apply.sh && psql \"$$DATABASE_URL\" -v ON_ERROR_STOP=1 -f /db/seed_dev.sql"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/empdb
      # Identity: set OIDC_ISSUER/OIDC_AUDIENCE for real SSO; dev headers stay off
      # in production unless AUTH_DEV_HEADERS=1 is set explicitly.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      AUTH_DEV_HEADERS: ${AUTH_DEV_HEADERS:-1}
      # Private object storage via MinIO (S3-compatible).
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-heec-exchange}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_FORCE_PATH_STYLE: "true"
      APP_VERSION: ${APP_VERSION:-compose}
    ports:
      - "3000:3000"

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    depends_on:
      - api
    ports:
      - "8080:8080"

volumes:
  pgdata:
  miniodata:
